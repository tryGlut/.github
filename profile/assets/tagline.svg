<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Find your people. Circles of 15. No swiping. No dating. Berlin and New York."><rect width="1200" height="100" fill="#0E0B0C"/><g font-family="Manrope,'Segoe UI',Helvetica,Arial,sans-serif"><style>@keyframes s0{0%,0.00%{opacity:0;transform:translateY(24px)}2.50%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0)}25.00%,100%{opacity:0;transform:translateY(-24px)}}.s0{opacity:0;animation:s0 12.0s infinite}</style><text class="s0" x="50%" y="62" text-anchor="middle" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#F6F1EF">Find your people.</text>
<style>@keyframes s1{0%,24.99%{opacity:0;transform:translateY(24px)}27.50%{opacity:1;transform:translateY(0)}47.00%{opacity:1;transform:translateY(0)}50.00%,100%{opacity:0;transform:translateY(-24px)}}.s1{opacity:0;animation:s1 12.0s infinite}</style><text class="s1" x="50%" y="62" text-anchor="middle" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#E5483F">Circles of 15.</text>
